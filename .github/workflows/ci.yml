name: ci

# Every commit on main is CI-green, and a release is only ever cut from a commit
# CI already passed. That rule is only enforceable if this workflow runs on both
# the pull request and the merge result.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # test-reporter creates a check run to surface failures as inline
  # annotations. Without checks:write it silently degrades to a plain upload.
  checks: write

concurrency:
  # A superseded run on the same branch is wasted compute. main is excluded:
  # cancelling there would leave a merged commit with no verdict, which is the
  # one place the green-main rule needs an answer.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Pinned image, not windows-latest. The toolchain pin in Test-Toolchain.ps1
    # is only meaningful if the image it runs on does not move underneath it —
    # otherwise a runner image update silently changes the binary and a
    # performance regression cannot be attributed to a code change.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Needed only for the Velopack `vpk` packaging tool in Phase 6, but
      # installed here so Test-Toolchain.ps1 can verify global.json resolves.
      # An unresolvable pin is a build failure waiting for the first release.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.304

      - uses: microsoft/setup-msbuild@v2

      # Runs before the build so a toolchain mismatch is reported as itself
      # rather than as a confusing compile error 10 minutes later.
      - name: Verify pinned toolchain
        shell: pwsh
        run: ./tools/Test-Toolchain.ps1

      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/Restore-Dependencies.ps1

      # Build.ps1 and Test.ps1 are the only build and test paths, here and
      # locally. "Works on my machine" and "works in CI" cannot diverge when
      # there is one code path.
      #
      # Test.ps1 builds each configuration itself and exits non-zero on any
      # failure, including exit 2 for a suite that did not actually run.
      - name: Build and test
        shell: pwsh
        run: ./tools/Test.ps1 -JUnitPath artifacts/test-results/results.xml

      # if: always() so a failing suite still uploads its report — the report is
      # most useful in exactly the case where the previous step failed.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: tests
          path: artifacts/test-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: error

      # The measurement rule is that performance numbers come from an installed
      # Release build. This is not that: it is the build-tree binary, uploaded so
      # a reviewer can check size and hardening flags without a local toolchain.
      - name: Upload Release binary
        uses: actions/upload-artifact@v4
        with:
          name: dhepz-release-x64
          path: build/x64/Release/dhepz.exe
          if-no-files-found: error
