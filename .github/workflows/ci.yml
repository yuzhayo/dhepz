name: ci

# Every commit on main is CI-green, and a release is only ever cut from a commit
# CI already passed. That rule is only enforceable if this workflow runs on both
# the pull request and the merge result.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded run on the same branch is wasted compute. main is excluded:
  # cancelling there would leave a merged commit with no verdict, which is the
  # one place the green-main rule needs an answer.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Pinned image, not windows-latest. The toolchain pin in Test-Toolchain.ps1
    # is only meaningful if the image it runs on does not move underneath it —
    # otherwise a runner image update silently changes the binary and a
    # performance regression cannot be attributed to a code change.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      # Deliberately no actions/setup-dotnet. Nothing in the build or test path
      # invokes dotnet — the runner image already ships a 9.0.3xx SDK, and
      # global.json's rollForward: latestPatch resolves to it. Installing a
      # pinned SDK downloaded 298 MB and took 6 of the job's 6.5 minutes, then
      # Test-Toolchain reported the preinstalled 9.0.316 anyway, so the download
      # was entirely discarded. Velopack's vpk tool is the first real dotnet
      # dependency; add setup-dotnet back in Phase 6 when packaging needs it.

      # Runs before the build so a toolchain mismatch is reported as itself
      # rather than as a confusing compile error 10 minutes later.
      - name: Verify pinned toolchain
        shell: pwsh
        run: ./tools/Test-Toolchain.ps1

      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/Restore-Dependencies.ps1

      # Build.ps1 and Test.ps1 are the only build and test paths, here and
      # locally. "Works on my machine" and "works in CI" cannot diverge when
      # there is one code path.
      #
      # Test.ps1 builds each configuration itself and exits non-zero on any
      # failure, including exit 2 for a suite that did not actually run.
      - name: Build and test
        shell: pwsh
        run: ./tools/Test.ps1 -JUnitPath artifacts/test-results/results.xml

      # The embedded UI set must resolve cleanly on every commit. A malformed
      # screen committed to the repo fails the job here with file(line,column)
      # diagnostics; -SelfTest proves the gate by feeding a deliberately broken
      # screen from a temp dir and demanding a line-numbered rejection.
      - name: Validate UI config
        shell: pwsh
        run: ./tools/Merge-UiConfig.ps1 -Configuration Release -SelfTest

      # Contract fixtures (#85): the three folders live in tests/fixtures/modules
      # and drive the gate test in the suite (healthy mounts, typo'd rejected,
      # diagnostics artifact written). Here we assert the build-time half: a
      # byte-level malformed module.json must fail the merge that embeds the
      # UI document, so a broken module can never ship.
      - name: Contract fixtures — broken manifest fails the build merge
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'fixture-root'
          $null = New-Item -ItemType Directory -Path "$temp\src\modules" -Force
          Copy-Item -Recurse tests/fixtures/modules/fixture-broken "$temp\src\modules\fixture-broken"
          $failed = $false
          try {
            ./tools/Merge-UiConfig.ps1 -GenerateEmbedded -RepositoryRoot $temp
          } catch {
            $failed = $true
          }
          if (-not $failed) {
            throw "fixture-broken module.json must fail the build-time merge"
          }
          Write-Host "Broken manifest fails the build merge: ok"

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics
          path: artifacts/diagnostics.json
          if-no-files-found: ignore

      # Emits GitHub annotations from the JUnit report directly, rather than via
      # a third-party reporter action. dorny/test-reporter's java-junit parser
      # ignores the `file`/`line` attributes on <testcase> and annotates the XML
      # file itself, which puts the marker on a build artifact instead of the
      # failing source line. RepoRelative() in test_main.cpp exists specifically
      # to make source annotations possible, so parsing the report here is what
      # actually delivers them. It also drops a third-party action from the
      # supply chain.
      #
      # if: always() because the report matters most when the previous step
      # failed. This step never fails the job on its own — the test step already
      # did, and a second failure would only obscure the real one.
      - name: Annotate test failures
        shell: pwsh
        if: always()
        run: |
          $reports = @(Get-ChildItem -Path artifacts/test-results -Filter *.xml -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host '::warning::No JUnit report was produced.'
            exit 0
          }
          foreach ($report in $reports) {
            $config = if ($report.BaseName -match '\.(\w+)$') { $Matches[1] } else { $report.BaseName }
            $xml = [xml](Get-Content -LiteralPath $report.FullName -Raw)
            # The runner reports a crash as a <failure> too, and emits no
            # `errors` attribute, so there is deliberately no <error> handling
            # here. Reading $xml.testsuites.errors would yield empty string.
            foreach ($case in $xml.SelectNodes('//testcase/failure')) {
              # A newline truncates an annotation at its first line, so the
              # expected/actual detail is encoded rather than lost.
              $message = ($case.InnerText -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
              $testcase = $case.ParentNode
              $title = "$config - $($testcase.classname).$($testcase.name)"
              Write-Host "::error file=$($testcase.file),line=$($testcase.line),title=$title::$message"
            }
            $suite = $xml.testsuites
            $verdict = if ([int]$suite.failures -eq 0) { 'all passed' } else { "$($suite.failures) failed" }
            "$config`: $($suite.tests) tests, $verdict" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: error

      # The measurement rule is that performance numbers come from an installed
      # Release build. This is not that: it is the build-tree binary, uploaded so
      # a reviewer can check size and hardening flags without a local toolchain.
      - name: Upload Release binary
        uses: actions/upload-artifact@v7
        with:
          name: dhepz-release-x64
          path: build/x64/Release/dhepz.exe
          if-no-files-found: error
